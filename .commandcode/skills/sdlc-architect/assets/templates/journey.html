<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{project_name}} — Development Journey</title>
<!--
  HOW TO UPDATE THIS FILE
  1. Edit ONLY the JSON block below (id="journey-data").
  2. Append new entries to the END of the "entries" array. Never edit or delete history.
  3. To correct or revise an earlier entry, add a NEW entry with "type": "revision"
     and "revises": "<id of the entry being revised>".
  4. Keep the JSON valid: double quotes, no trailing comma after the last entry.
  5. Update "updated" and "phase" at the top of the JSON.
  Everything below the JSON is presentation. Do not rewrite it per project.
-->
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --panel-2: #1a2230; --line: #26303f;
    --text: #e6edf6; --muted: #8b9bb0; --accent: #4ea1ff;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --info: #a371f7;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fb; --panel: #ffffff; --panel-2: #eef2f7; --line: #d7dee8;
      --text: #111823; --muted: #5b6b80; --accent: #0b66d0;
      --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --info: #8250df;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 32px 24px 20px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--panel), var(--bg));
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .sub b { color: var(--text); font-weight: 600; }
  main { padding: 24px 24px 80px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .stat .n { font-size: 22px; font-weight: 650; }
  .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 28px; }
  .chip {
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: var(--panel-2); }
  input[type="search"] {
    flex: 1; min-width: 180px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13px;
  }
  input[type="search"]:focus, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .day { margin-bottom: 32px; }
  .day > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 0 0 12px; position: sticky; top: 0; background: var(--bg); padding: 6px 0;
  }
  ol { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
  li { position: relative; padding: 0 0 22px 22px; }
  li::before {
    content: ""; position: absolute; left: -7px; top: 7px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--bg); border: 2px solid var(--muted);
  }
  li[data-type="revision"]::before { border-color: var(--warn); }
  li[data-type="gate"]::before { border-color: var(--ok); }
  li[data-type="finding"]::before { border-color: var(--bad); }
  li[data-type="deploy"]::before { border-color: var(--info); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .badge[data-type="init"] { color: var(--accent); border-color: var(--accent); }
  .badge[data-type="gate"] { color: var(--ok); border-color: var(--ok); }
  .badge[data-type="revision"] { color: var(--warn); border-color: var(--warn); }
  .badge[data-type="finding"] { color: var(--bad); border-color: var(--bad); }
  .badge[data-type="deploy"] { color: var(--info); border-color: var(--info); }
  .phase { font-size: 11px; color: var(--muted); }
  h3 { margin: 2px 0 4px; font-size: 15.5px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  .files { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 12px; color: var(--text); }
  .rev { margin-top: 8px; font-size: 12.5px; color: var(--warn); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { color: var(--muted); font-size: 12px; padding: 0 24px 40px; }
  @media print {
    body { background: #fff; color: #000; }
    .controls, .stats { display: none; }
    .card { break-inside: avoid; border-color: #ccc; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1 id="title">{{project_name}} — Development Journey</h1>
    <div class="sub">
      <span>Current phase <b id="phase">—</b></span>
      <span>Updated <b id="updated">—</b></span>
      <span>Entries <b id="count">—</b></span>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="stats" aria-label="Summary">
    <div class="stat"><div class="n" id="s-gates">0</div><div class="l">Gates</div></div>
    <div class="stat"><div class="n" id="s-revisions">0</div><div class="l">Revisions</div></div>
    <div class="stat"><div class="n" id="s-builds">0</div><div class="l">Build steps</div></div>
    <div class="stat"><div class="n" id="s-open">0</div><div class="l">Open findings</div></div>
  </section>

  <div class="controls">
    <button class="chip" data-filter="all" aria-pressed="true">All</button>
    <button class="chip" data-filter="init" aria-pressed="false">Init</button>
    <button class="chip" data-filter="decision" aria-pressed="false">Decisions</button>
    <button class="chip" data-filter="build" aria-pressed="false">Build</button>
    <button class="chip" data-filter="revision" aria-pressed="false">Revisions</button>
    <button class="chip" data-filter="gate" aria-pressed="false">Gates</button>
    <button class="chip" data-filter="finding" aria-pressed="false">Findings</button>
    <button class="chip" data-filter="deploy" aria-pressed="false">Deploy</button>
    <input type="search" id="q" placeholder="Search the journey…" aria-label="Search entries">
  </div>

  <div id="timeline"></div>
  <noscript><p class="empty">Enable JavaScript to render the timeline. The raw record is in the JSON block at the bottom of this file.</p></noscript>
</main>

<footer class="wrap">
  Append-only record. Corrections are added as new <code>revision</code> entries, never by editing history.
</footer>

<script type="application/json" id="journey-data">
{
  "project": "{{project_name}}",
  "slug": "{{slug}}",
  "phase": "0 — brief",
  "updated": "{{date}}",
  "entries": [
    {
      "id": "{{date}}-001",
      "date": "{{date}}",
      "phase": "0",
      "type": "init",
      "title": "Project started",
      "summary": "Journey opened before any code was written. Brief handed to the owner; nothing designed yet.",
      "files": ["docs/sdlc/{{slug}}/00-brief.md"],
      "status": "done"
    }
  ]
}
</script>

<script>
(function () {
  var data = JSON.parse(document.getElementById('journey-data').textContent);
  var entries = data.entries || [];
  var current = 'all';
  var query = '';

  document.getElementById('title').textContent = data.project + ' — Development Journey';
  document.getElementById('phase').textContent = data.phase;
  document.getElementById('updated').textContent = data.updated;
  document.getElementById('count').textContent = entries.length;

  function tally(type) {
    return entries.filter(function (e) { return e.type === type; }).length;
  }
  document.getElementById('s-gates').textContent = tally('gate');
  document.getElementById('s-revisions').textContent = tally('revision');
  document.getElementById('s-builds').textContent = tally('build');
  document.getElementById('s-open').textContent =
    entries.filter(function (e) { return e.type === 'finding' && e.status === 'open'; }).length;

  function matches(e) {
    if (current !== 'all' && e.type !== current) return false;
    if (!query) return true;
    var hay = (e.title + ' ' + (e.summary || '') + ' ' + (e.files || []).join(' ')).toLowerCase();
    return hay.indexOf(query) !== -1;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render() {
    var host = document.getElementById('timeline');
    var shown = entries.filter(matches);
    if (!shown.length) {
      host.innerHTML = '<p class="empty">No entries match this filter.</p>';
      return;
    }
    // Newest first, but keep each day's internal order by id.
    var byDay = {};
    shown.forEach(function (e) {
      var d = (e.date || '').slice(0, 10);
      (byDay[d] = byDay[d] || []).push(e);
    });
    var days = Object.keys(byDay).sort().reverse();
    var html = days.map(function (d) {
      var items = byDay[d].slice().sort(function (a, b) {
        return String(b.id).localeCompare(String(a.id));
      }).map(function (e) {
        var files = (e.files || []).map(function (f) {
          return '<code>' + esc(f) + '</code>';
        }).join('');
        var rev = e.revises
          ? '<div class="rev">revises <code>' + esc(e.revises) + '</code></div>'
          : '';
        return '<li data-type="' + esc(e.type) + '">' +
          '<div class="card">' +
            '<div class="top">' +
              '<span class="badge" data-type="' + esc(e.type) + '">' + esc(e.type) + '</span>' +
              '<span class="phase">phase ' + esc(e.phase || '—') + '</span>' +
              '<span class="phase">' + esc(e.id) + '</span>' +
            '</div>' +
            '<h3>' + esc(e.title) + '</h3>' +
            '<p>' + esc(e.summary || '') + '</p>' +
            (files ? '<div class="files">' + files + '</div>' : '') +
            rev +
          '</div>' +
        '</li>';
      }).join('');
      return '<section class="day"><h2>' + esc(d) + '</h2><ol>' + items + '</ol></section>';
    }).join('');
    host.innerHTML = html;
  }

  document.querySelectorAll('.chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      current = chip.getAttribute('data-filter');
      document.querySelectorAll('.chip').forEach(function (c) {
        c.setAttribute('aria-pressed', String(c === chip));
      });
      render();
    });
  });

  document.getElementById('q').addEventListener('input', function (e) {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  render();
})();
</script>
</body>
</html>
